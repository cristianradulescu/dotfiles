# Hyprland config, ported from ~/dotfiles/.config/sway/config
#
# Read https://wiki.hypr.land/Configuring/ for a complete reference.

### Variables
#
# Logo key
$mod = SUPER
# Home row direction keys, like vim
$left = h
$down = j
$up = k
$right = l
# Your preferred terminal emulator
$term = alacritty
# Your preferred application launcher
$menu = fuzzel --show drun

# Only one instance: hyprlock stays in the foreground until unlocked
$lock = pidof hyprlock || hyprlock

# Theme (Catppuccin Mocha)
$rosewater = f5e0dc
$flamingo = f2cdcd
$pink = f5c2e7
$mauve = cba6f7
$red = f38ba8
$maroon = eba0ac
$peach = fab387
$yellow = f9e2af
$green = a6e3a1
$teal = 94e2d5
$sky = 89dceb
$sapphire = 74c7ec
$blue = 89b4fa
$lavender = b4befe
$text = cdd6f4
$subtext1 = bac2de
$subtext0 = a6adc8
$overlay2 = 9399b2
$overlay1 = 7f849c
$overlay0 = 6c7086
$surface2 = 585b70
$surface1 = 45475a
$surface0 = 313244
$base = 1e1e2e
$mantle = 181825
$crust = 11111b

### Output configuration
#
# You can get the names/descriptions of your outputs by running: hyprctl monitors
#
# Fallback for any monitor not listed below
# monitor = , preferred, auto, 1

## Default / Thinkpad T14 14"
# monitor = eDP-1, 1920x1080, 0x0, 1

## Thinkpad P14 14"
# monitor = eDP-1, 1920x1200, 0x0, 1

## Ideapad Pro 5 14" 2k
monitor = eDP-1, 2880x1800, 0x0, 1.25

## DELL 27' 4K (disable laptop display with `hyprctl keyword monitor eDP-1,disable`)
# monitor = desc:Dell Inc. DELL P2723QE 9CGR964, 3840x2160, 1x0, 1

## Dual setup: Dell 27' 4K & laptop
# monitor = DP-2, 3840x2160, 0x0, 1
# monitor = eDP-1, disable

### Environment
#
# Use the same cursor everywhere (matches gsettings cursor-theme)
env = XCURSOR_THEME,Yaru
env = XCURSOR_SIZE,24

### Autostart
#
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = hyprctl setcursor Yaru 24

# Import proxy environment variables into systemd user and DBus for graphical apps
exec = systemctl --user import-environment http_proxy https_proxy all_proxy no_proxy PROXY_PAC_URL
exec = dbus-update-activation-environment --systemd http_proxy https_proxy all_proxy no_proxy PROXY_PAC_URL

### Idle configuration
#
# Lock after 15 minutes, turn the displays off after 20 and lock before
# sleep. See hypridle.conf.
exec-once = hypridle

### Look and feel
#
general {
    gaps_in = 3 # half of sway's "gaps inner 6": Hyprland applies it on each side
    gaps_out = 10 # sway's "gaps outer 4" + "gaps inner 6"
    border_size = 4

    col.active_border = rgb($lavender)
    col.inactive_border = rgb($surface0)
    col.nogroup_border_active = rgb($lavender)
    col.nogroup_border = rgb($surface0)

    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = global, 1, 3, default
    animation = windows, 1, 3, easeOutQuint, popin 90%
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, easeOutQuint, slide
}

# Tabbed/stacked layouts from sway are replaced by Hyprland groups
group {
    col.border_active = rgb($lavender)
    col.border_inactive = rgb($surface1)
    col.border_locked_active = rgb($peach)
    col.border_locked_inactive = rgb($surface1)

    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_weight_active = bold
        font_weight_inactive = bold
        font_size = 10
        height = 18
        gradients = true
        text_color = rgb($crust)
        text_color_inactive = rgb($subtext1)
        col.active = rgb($lavender)
        col.inactive = rgb($surface0)
        col.locked_active = rgb($peach)
        col.locked_inactive = rgb($surface0)
    }
}

dwindle {
    preserve_split = true
    # Always open new windows to the right/bottom, like sway
    # (default follows the mouse, so it can split to the left/top)
    force_split = 2
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Focus activated windows (sway: focus_on_window_activation smart)
    focus_on_activate = true
}

binds {
    # Switch back to the previous workspace when pressing the current one's key
    workspace_back_and_forth = true
}

# Smart gaps: no gaps when a workspace has a single tiled window
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

### Input configuration
#
# You can get the names of your inputs by running: hyprctl devices
input {
    kb_layout = us
    # Use CapsLock as Control
    kb_options = ctrl:nocaps
    repeat_delay = 250
    repeat_rate = 50

    follow_mouse = 1

    touchpad {
        disable_while_typing = true
        tap-to-click = true
        natural_scroll = true
        middle_button_emulation = true
    }
}

### Gesture bindings
#
# 3-finger swipe to navigate workspaces
gesture = 3, horizontal, workspace

### Key bindings
#
# Basics:
#
# Start a terminal
bind = $mod, Return, exec, $term

# Kill focused window
bind = $mod, Q, killactive,

# Start your launcher
bind = $mod, D, exec, $menu

# Drag windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Reload the configuration file
bind = $mod SHIFT, C, exec, hyprctl reload

# Power menu: lock, logout, suspend, reboot, shutdown
bind = $mod SHIFT, E, exec, ~/dotfiles/bin/sway-powermenu

# Lock the screen
bind = $mod CONTROL, L, exec, $lock

# Screenshots (opened in grabnotate for annotation)
bind = , Print, exec, ~/dotfiles/bin/sway-screenshot full
bind = $mod, Print, exec, ~/dotfiles/bin/sway-screenshot area

#
# Moving around:
#
# Move your focus around
bind = $mod, $left, movefocus, l
bind = $mod, $down, movefocus, d
bind = $mod, $up, movefocus, u
bind = $mod, $right, movefocus, r
# Or use $mod+[up|down|left|right]
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# Move the focused window with the same, but add Shift
# (movewindoworgroup also moves windows in and out of groups, like sway tabs)
bind = $mod SHIFT, $left, movewindoworgroup, l
bind = $mod SHIFT, $down, movewindoworgroup, d
bind = $mod SHIFT, $up, movewindoworgroup, u
bind = $mod SHIFT, $right, movewindoworgroup, r
# Ditto, with arrow keys
bind = $mod SHIFT, left, movewindoworgroup, l
bind = $mod SHIFT, down, movewindoworgroup, d
bind = $mod SHIFT, up, movewindoworgroup, u
bind = $mod SHIFT, right, movewindoworgroup, r

#
# Workspaces:
#
# Switch to workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
# Move focused window to workspace
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

#
# Layout stuff:
#
# Choose where the next window opens: to the right ($mod+b) or below ($mod+v)
bind = $mod, B, layoutmsg, preselect r
bind = $mod, V, layoutmsg, preselect d

# Groups stand in for sway's tabbed/stacked layouts:
# $mod+w toggles the focused window into a group, $mod+s locks/unlocks it
# and $mod+Tab cycles through the group's windows
bind = $mod, W, togglegroup,
bind = $mod, S, lockactivegroup, toggle
bind = $mod, Tab, changegroupactive, f
bind = $mod SHIFT, Tab, changegroupactive, b
# Toggle the split direction of the focused container
bind = $mod, E, layoutmsg, togglesplit

# Make the current focus fullscreen
bind = $mod, F, fullscreen, 0

# Toggle the current focus between tiling and floating mode
bind = $mod SHIFT, space, togglefloating,

# Cycle focus through floating windows
bind = $mod, space, cyclenext, floating

#
# Scratchpad:
#
# Hyprland's equivalent is a special workspace.
# Move the currently focused window to the scratchpad
bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratchpad
# Show or hide the scratchpad
bind = $mod, minus, togglespecialworkspace, scratchpad

#
# Resizing windows:
#
bind = $mod, R, submap, resize
submap = resize
# left will shrink the window's width
# right will grow the window's width
# up will shrink the window's height
# down will grow the window's height
binde = , $left, resizeactive, -10 0
binde = , $down, resizeactive, 0 10
binde = , $up, resizeactive, 0 -10
binde = , $right, resizeactive, 10 0

# Ditto, with arrow keys
binde = , left, resizeactive, -10 0
binde = , down, resizeactive, 0 10
binde = , up, resizeactive, 0 -10
binde = , right, resizeactive, 10 0

# Return to default mode
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

#
# Brightness control
#
bindel = , XF86MonBrightnessUp, exec, ~/dotfiles/bin/sway-osd-notify brightness-up
bindel = , XF86MonBrightnessDown, exec, ~/dotfiles/bin/sway-osd-notify brightness-down

#
# Volume control
#
bindel = , XF86AudioRaiseVolume, exec, ~/dotfiles/bin/sway-osd-notify volume-up
bindel = , XF86AudioLowerVolume, exec, ~/dotfiles/bin/sway-osd-notify volume-down
bindl = , XF86AudioMute, exec, ~/dotfiles/bin/sway-osd-notify volume-mute
bindl = , XF86AudioMicMute, exec, ~/dotfiles/bin/sway-osd-notify mic-mute

# Notifications (swaync)
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, N, exec, swaync-client -d -sw

# Clipboard history (cliphist + wl-clipboard)
bind = $mod SHIFT, V, exec, cliphist list | fuzzel --dmenu --prompt "󰅌  " --width 80 --lines 15 | cliphist decode | wl-copy

# Enable/disable internal panel on lid open/close. Opening reloads the config
# so the panel comes back with its configured resolution and scale.
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl reload

### Window rules
#
windowrule {
    name = float-system-tools
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|solaar)$

    float = yes
    size = 800 500
    center = yes
}

windowrule {
    name = picture-in-picture
    match:title = (?i)^picture.in.picture$

    float = yes
    pin = yes
}

windowrule {
    name = grabnotate
    match:class = ^(app.grabnotate)$

    float = yes
    center = yes
}

windowrule {
    # Ignore maximize requests from apps
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
