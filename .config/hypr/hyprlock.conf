# Lock screen, styled after ~/dotfiles/.config/swaylock/config (Catppuccin Mocha)
#
# Read https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/ for a complete reference.
#
# Shortcuts to clear the password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = JetBrainsMono Nerd Font

$lavender = rgb(b4befe)
$peach = rgb(fab387)
$blue = rgb(89b4fa)
$maroon = rgb(eba0ac)
$text = rgb(cdd6f4)
$base = rgba(1e1e2ecc)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/dotfiles/backgrounds/waves.png
    color = rgb(1e1e2e)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 4
    rounding = 10

    inner_color = $base
    outer_color = $lavender
    check_color = $blue
    fail_color = $maroon
    capslock_color = $peach

    font_color = $text
    font_family = $font
    placeholder_text = <i>Password...</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 72
    font_family = $font

    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $lavender
    font_size = 18
    font_family = $font

    position = 0, 40
    halign = center
    valign = center
}
