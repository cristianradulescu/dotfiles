[general]
import = ["~/dotfiles/.config/alacritty/themes/catppuccin-mocha.toml"]

[env]
TERM = "xterm-256color"

[window]
# opacity = 0.9
startup_mode = "Maximized"
dynamic_padding = true # spread leftover pixels evenly instead of a gap at the bottom
# decorations = "None"

[scrolling]
history = 50000

[font]
normal = { family = "JetBrainsMonoNL Nerd Font", style = "Regular" }
size = 12
# Letter spacing (default=0)
offset.x = 0
# Line spacing (default=0)
offset.y = 4 # ≈ `line_height`

[cursor]
style = { shape = "Beam", blinking = "Always" }

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[keyboard]
# Keybindings for Alacritty
bindings = [
  { key = "n", mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "q", mods = "Control|Shift", action = "Quit" },
  { key = "PageUp", mods = "Shift", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift", action = "ScrollPageDown" },
  { key = "=", mods = "Control", action = "IncreaseFontSize" },
  { key = "-", mods = "Control", action = "DecreaseFontSize" },
  { key = "0", mods = "Control", action = "ResetFontSize" },
  { key = "v", mods = "Alt", action = "ToggleViMode" },
]
